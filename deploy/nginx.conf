server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* (?:flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.js)$ {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|wasm|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
