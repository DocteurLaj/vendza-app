<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vendza Marketplace">
  <meta name="theme-color" content="#0B3A40">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vendza">

  <title>Vendza Marketplace</title>
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0B3A40;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <script src="vendza-config.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js');
      });
    }
  </script>
  <script>
    // Flutter Web CanvasKit uses WebGL. If the browser discards the GPU
    // context while Vendza is in the background, affected Flutter engines can
    // leave a permanently black canvas. Reload once when that exact failure is
    // detected so the user gets a fresh WebGL context instead of a dead tab.
    (function () {
      const reloadKey = 'vendza-webgl-context-reload-at';
      const cooldownMs = 30000;

      function reloadVendza(reason) {
        const now = Date.now();
        const lastReload = Number(sessionStorage.getItem(reloadKey) || 0);
        if (now - lastReload < cooldownMs) {
          return;
        }
        sessionStorage.setItem(reloadKey, String(now));
        console.warn('Reloading Vendza after WebGL context loss:', reason);
        window.setTimeout(function () {
          window.location.reload();
        }, 250);
      }

      function isFlutterContextLossError(message) {
        return /LateInitializationError|_handledContextLostEvent|webglcontextlost|context lost/i.test(String(message || ''));
      }

      function watchCanvas(canvas) {
        if (!canvas || canvas.dataset.vendzaContextLossWatcher === 'true') {
          return;
        }
        canvas.dataset.vendzaContextLossWatcher = 'true';
        canvas.addEventListener('webglcontextlost', function (event) {
          event.preventDefault();
          reloadVendza('webglcontextlost');
        }, false);
      }

      window.addEventListener('error', function (event) {
        if (isFlutterContextLossError(event && (event.message || event.error))) {
          reloadVendza('flutter-error');
        }
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (isFlutterContextLossError(event && event.reason)) {
          reloadVendza('flutter-promise');
        }
      });

      function watchExistingCanvases() {
        document.querySelectorAll('canvas').forEach(watchCanvas);
      }

      watchExistingCanvases();
      new MutationObserver(watchExistingCanvases).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
