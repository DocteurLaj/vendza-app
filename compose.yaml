services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.44.2}
        VENDZA_API_BASE_URL: ${VENDZA_API_BASE_URL:?VENDZA_API_BASE_URL is required}
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    image: vendza-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${VENDZA_WEB_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
