name: Rotate SasPay webhook secret on the API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replace SASPAY_WEBHOOK_SECRET in the API environment and redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          NEW_SECRET: ${{ secrets.SASPAY_WEBHOOK_SECRET_NEW }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [ "${#NEW_SECRET}" -eq 64 ] || { echo "new secret has unexpected length"; exit 1; }
          api="${DOKPLOY_URL%/}/api"
          app=CHl42zYU8qsZw3QyKn9dP
          hdr=(--header "accept: application/json" --header "content-type: application/json" --header "x-api-key: ${DOKPLOY_API_TOKEN}")
          curl --fail --silent --show-error "$api/application.one?applicationId=$app" "${hdr[@]}" -o app.json
          jq -r '.env // ""' app.json > env.txt
          if grep -q '^enc:' env.txt; then echo "env returned encrypted; aborting without changes"; exit 1; fi
          before=$(grep -c '^SASPAY_WEBHOOK_SECRET=' env.txt || true)
          [ "$before" -eq 1 ] || { echo "expected exactly one SASPAY_WEBHOOK_SECRET line, found $before"; exit 1; }
          total_before=$(grep -c '=' env.txt || true)
          awk -v s="$NEW_SECRET" 'BEGIN{FS=OFS="="} /^SASPAY_WEBHOOK_SECRET=/{print "SASPAY_WEBHOOK_SECRET=" s; next} {print}' env.txt > env.new
          total_after=$(grep -c '=' env.new || true)
          [ "$total_before" -eq "$total_after" ] || { echo "variable count changed; aborting"; exit 1; }
          echo "variables: $total_after (unchanged count), secret line replaced"
          payload=$(jq -nc --arg id "$app" --rawfile env env.new \
            --arg ba "$(jq -r '.buildArgs // ""' app.json)" --arg bs "$(jq -r '.buildSecrets // ""' app.json)" \
            '{applicationId:$id, env:$env, buildArgs:$ba, buildSecrets:$bs, createEnvFile:true}')
          code=$(curl --silent --show-error -o resp.json -w '%{http_code}' --request POST "$api/application.saveEnvironment" "${hdr[@]}" --data "$payload")
          [ "$code" = 200 ] || { echo "saveEnvironment failed: $code"; exit 1; }
          echo "environment saved"
          curl --fail --silent --show-error --request POST "$api/application.redeploy" "${hdr[@]}" \
            --data "$(jq -nc --arg id "$app" '{applicationId:$id, title:"Rotate SasPay webhook secret"}')" >/dev/null
          echo "redeploy requested"
          rm -f app.json env.txt env.new resp.json
