name: Vendza CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  VENDZA_API_BASE_URL: ${{ vars.VENDZA_API_BASE_URL || 'https://vendza-vendzaapi-lenoer-604821-72-60-90-32.sslip.io/api/v1' }}
  VENDZA_MEDIA_BASE_URL: ${{ vars.VENDZA_MEDIA_BASE_URL || 'https://vendza-vendzaminiostorage-tx8h0h-c106eb-72-60-90-32.sslip.io/vendza-images' }}
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '' }}
  GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || '' }}
  VENDZA_FIREBASE_API_KEY: ${{ vars.VENDZA_FIREBASE_API_KEY || '' }}
  VENDZA_FIREBASE_APP_ID: ${{ vars.VENDZA_FIREBASE_APP_ID || '' }}
  VENDZA_FIREBASE_AUTH_DOMAIN: ${{ vars.VENDZA_FIREBASE_AUTH_DOMAIN || '' }}
  VENDZA_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VENDZA_FIREBASE_MESSAGING_SENDER_ID || '' }}
  VENDZA_FIREBASE_PROJECT_ID: ${{ vars.VENDZA_FIREBASE_PROJECT_ID || '' }}
  VENDZA_FIREBASE_STORAGE_BUCKET: ${{ vars.VENDZA_FIREBASE_STORAGE_BUCKET || '' }}
  VENDZA_FIREBASE_VAPID_KEY: ${{ vars.VENDZA_FIREBASE_VAPID_KEY || '' }}

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        timeout-minutes: 10
      - run: flutter test
        timeout-minutes: 15
      - name: Build Web
        timeout-minutes: 20
        run: >-
          flutter build web --release
          --dart-define=VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
          --dart-define=VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
          --dart-define=VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
          --dart-define=VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
          --dart-define=VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
          --dart-define=VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
          --dart-define=VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}

  android:
    name: Android APK and AAB
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android Firebase config
        id: android_firebase
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Android artifacts because ANDROID_GOOGLE_SERVICES_JSON_BASE64 is missing."
            exit 0
          fi
          python3 -c 'import base64, os, pathlib; pathlib.Path("android/app/google-services.json").write_bytes(base64.b64decode(os.environ["ANDROID_GOOGLE_SERVICES_JSON_BASE64"]))'
          echo "available=true" >> "$GITHUB_OUTPUT"
      - if: steps.android_firebase.outputs.available == 'true'
        run: flutter pub get

      - name: Configure Android release signing
        if: steps.android_firebase.outputs.available == 'true'
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing. Building a debug APK you can install on a phone."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.android_firebase.outputs.available == 'true' && steps.signing.outputs.signed == 'true'
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
          --dart-define=VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
          --dart-define=VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
          --dart-define=VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
          --dart-define=VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
          --dart-define=VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
          --dart-define=VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}

      - name: Build debug APK
        if: steps.android_firebase.outputs.available == 'true' && steps.signing.outputs.signed != 'true'
        run: >-
          flutter build apk --debug
          --build-number=${{ github.run_number }}
          --dart-define=VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
          --dart-define=VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
          --dart-define=VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
          --dart-define=VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
          --dart-define=VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
          --dart-define=VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
          --dart-define=VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}

      - name: Build release AAB
        if: steps.android_firebase.outputs.available == 'true' && steps.signing.outputs.signed == 'true'
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
          --dart-define=VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
          --dart-define=VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
          --dart-define=VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
          --dart-define=VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
          --dart-define=VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
          --dart-define=VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}

      - name: Upload Android artifacts
        if: steps.android_firebase.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vendza-android-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for vendza.online
        if: steps.android_firebase.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/vendza.apk
          if gh release view android >/dev/null 2>&1; then
            gh release upload android dist/vendza.apk --clobber
          else
            gh release create android dist/vendza.apk \
              --title "Vendza Android" \
              --notes "Dernier APK Android. Le bouton Télécharger de vendza.online pointe ici."
          fi

      - name: Remove signing material
        if: always() && steps.android_firebase.outputs.available == 'true'
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

  ios-validation:
    name: iOS unsigned validation
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore iOS Firebase config
        id: ios_firebase
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [[ -z "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping iOS validation because IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is missing."
            exit 0
          fi
          python3 -c 'import base64, os, pathlib; pathlib.Path("ios/Runner/GoogleService-Info.plist").write_bytes(base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"]))'
          echo "available=true" >> "$GITHUB_OUTPUT"
      - if: steps.ios_firebase.outputs.available == 'true'
        run: flutter pub get
      - name: Build iOS without code signing
        if: steps.ios_firebase.outputs.available == 'true'
        run: >-
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
          --dart-define=VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=GOOGLE_IOS_CLIENT_ID=${{ env.GOOGLE_IOS_CLIENT_ID }}
          --dart-define=VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
          --dart-define=VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
          --dart-define=VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
          --dart-define=VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
          --dart-define=VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
          --dart-define=VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}
      - name: Package unsigned iOS application
        if: steps.ios_firebase.outputs.available == 'true'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/vendza-ios-unsigned.zip
      - name: Upload unsigned iOS artifact
        if: steps.ios_firebase.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vendza-ios-unsigned-${{ github.run_number }}
          path: build/ios/vendza-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  web-image:
    name: Web image and Dokploy
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            VENDZA_API_BASE_URL=${{ env.VENDZA_API_BASE_URL }}
            VENDZA_MEDIA_BASE_URL=${{ env.VENDZA_MEDIA_BASE_URL }}
            GOOGLE_WEB_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT_ID }}
            VENDZA_FIREBASE_API_KEY=${{ env.VENDZA_FIREBASE_API_KEY }}
            VENDZA_FIREBASE_APP_ID=${{ env.VENDZA_FIREBASE_APP_ID }}
            VENDZA_FIREBASE_AUTH_DOMAIN=${{ env.VENDZA_FIREBASE_AUTH_DOMAIN }}
            VENDZA_FIREBASE_MESSAGING_SENDER_ID=${{ env.VENDZA_FIREBASE_MESSAGING_SENDER_ID }}
            VENDZA_FIREBASE_PROJECT_ID=${{ env.VENDZA_FIREBASE_PROJECT_ID }}
            VENDZA_FIREBASE_STORAGE_BUCKET=${{ env.VENDZA_FIREBASE_STORAGE_BUCKET }}
            VENDZA_FIREBASE_VAPID_KEY=${{ env.VENDZA_FIREBASE_VAPID_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [[ -z "$DOKPLOY_URL" || -z "$DOKPLOY_API_TOKEN" || -z "$DOKPLOY_APPLICATION_ID" ]]; then
            echo "::notice::Web image published. Add the three DOKPLOY_* secrets to enable automatic deployment."
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"
