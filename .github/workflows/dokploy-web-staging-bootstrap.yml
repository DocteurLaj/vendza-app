name: Bootstrap Dokploy web staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create and configure Dokploy staging application
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          ENVIRONMENT_ID: EZoAZXQqYxX4qa6fYMGMD
          GITHUB_ID: q-GBtnIXppPPTHdsmZccD
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error \
              --request POST \
              "${DOKPLOY_URL%/}/api/$1" \
              --header "accept: application/json" \
              --header "content-type: application/json" \
              --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
              --data "$2"
          }

          application_id="d2mk5ASilX-6WhgDV5kK4"
          echo "Using staging application: ${application_id}"

          build_payload=$(jq -nc \
            --arg id "$application_id" \
            '{applicationId:$id,buildType:"dockerfile",dockerfile:"Dockerfile",dockerContextPath:".",dockerBuildStage:null,herokuVersion:null,railpackVersion:null}')
          build_status=$(curl --silent --show-error \
            --output /tmp/build-type.json \
            --write-out '%{http_code}' \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.saveBuildType" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "$build_payload")
          echo "saveBuildType status: ${build_status}"
          cat /tmp/build-type.json
          test "$build_status" = 200

          final=$(curl --fail --silent --show-error \
            --request GET \
            "${DOKPLOY_URL%/}/api/application.one?applicationId=${application_id}" \
            --header "accept: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}")

          printf '%s' "$final" | jq '{applicationId,name,appName,sourceType,repository,owner,branch,buildPath,buildType,dockerfile,dockerContextPath,autoDeploy,applicationStatus}'
          test "$(printf '%s' "$final" | jq -r '.sourceType')" = "github"
          test "$(printf '%s' "$final" | jq -r '.repository')" = "vendza-app"
          test "$(printf '%s' "$final" | jq -r '.buildType')" = "dockerfile"
