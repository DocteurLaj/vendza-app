name: TMP api domain switch (admin env + duplicate cleanup)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      ADMIN_APP_ID: qrH_E1A1zIa0qSqUvWpTS
      DUP_DOMAIN_ID: t8JE-JIdshJSpy9Jmmppd
    steps:
      - name: Set admin env to exactly VENDZA_API_URL
        shell: bash
        run: |
          set -euo pipefail
          curl -sf "${DOKPLOY_URL%/}/api/application.one?applicationId=${ADMIN_APP_ID}" -H "x-api-key: ${DOKPLOY_API_TOKEN}" > /tmp/app.json
          payload=$(jq -n --arg id "$ADMIN_APP_ID" --slurpfile a /tmp/app.json \
            '{applicationId:$id, env:"VENDZA_API_URL=https://api.vendza.online", buildArgs:($a[0].buildArgs // ""), buildSecrets:($a[0].buildSecrets // ""), createEnvFile:($a[0].createEnvFile // true)}')
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "${DOKPLOY_URL%/}/api/application.saveEnvironment" \
            -H "content-type: application/json" -H "x-api-key: ${DOKPLOY_API_TOKEN}" --data "$payload")
          echo "saveEnvironment HTTP $code"; test "$code" -lt 300
      - name: Redeploy admin
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "content-type: application/json" -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "{\"applicationId\":\"${ADMIN_APP_ID}\",\"titleLog\":\"#117 admin env fix: VENDZA_API_URL -> api.vendza.online\"}")
          echo "deploy HTTP $code"; test "$code" -lt 300
