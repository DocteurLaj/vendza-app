name: One-time Fix API Auto Deploy

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Dokploy auto deploy and trigger release
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          APPLICATION_ID: CHl42zYU8qsZw3QyKn9dP
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          headers=(-H "x-api-key: ${DOKPLOY_API_TOKEN}" -H "Content-Type: application/json")
          hook_url="${base}/api/deploy/github"
          hooks="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DocteurLaj/vendza-api/hooks)"
          if ! printf '%s' "${hooks}" | python3 -c 'import json,sys; u=sys.argv[1]; print(any(h.get("config",{}).get("url")==u for h in json.load(sys.stdin)))' "${hook_url}"; then
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/DocteurLaj/vendza-api/hooks \
              --data "{\"name\":\"web\",\"active\":true,\"events\":[\"push\"],\"config\":{\"url\":\"${hook_url}\",\"content_type\":\"json\",\"insecure_ssl\":\"0\"}}" \
              -o hook.json
          fi
          curl --fail-with-body -sS -X POST "${base}/api/application.update" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"autoDeploy\":true,\"triggerType\":\"push\"}" \
            -o update.json
          curl --fail-with-body -sS -X POST "${base}/api/application.deploy" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"title\":\"Deploy Vendza API from main\",\"description\":\"Synchronize production with vendza-api main\"}" \
            -o deploy.json
          curl --fail-with-body -sS "${base}/api/application.one?applicationId=${APPLICATION_ID}" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" -o state.json
          curl --fail-with-body -sS "${base}/api/application.readLogs?applicationId=${APPLICATION_ID}&tail=1000" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" -o logs.json
          python3 - <<'PY'
          import json
          state=json.load(open('state.json'))
          print(json.dumps({
              'name': state.get('name'),
              'autoDeploy': state.get('autoDeploy'),
              'triggerType': state.get('triggerType'),
              'branch': state.get('branch'),
              'repository': state.get('repository'),
              'applicationStatus': state.get('applicationStatus'),
              'deployment_count': len(state.get('deployments', [])),
              'latest_deployment': state.get('deployments', [])[-1] if state.get('deployments') else None,
          }, ensure_ascii=False))
          logs=json.load(open('logs.json'))
          text=json.dumps(logs, ensure_ascii=False).lower()
          print(json.dumps({'logs_type': type(logs).__name__, 'log_keys': sorted(logs.keys()) if isinstance(logs, dict) else None, 'contains_webhook': 'webhook' in text}))
          PY
