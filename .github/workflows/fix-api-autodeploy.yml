name: One-time Fix API Auto Deploy

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Dokploy auto deploy and trigger release
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          APPLICATION_ID: CHl42zYU8qsZw3QyKn9dP
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          headers=(-H "x-api-key: ${DOKPLOY_API_TOKEN}" -H "Content-Type: application/json")
          hook_url="${base}/api/deploy/github"

          curl --fail-with-body -sS -X POST "${base}/api/application.update" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"autoDeploy\":true,\"triggerType\":\"push\"}" \
            -o update.json
          curl --fail-with-body -sS -X POST "${base}/api/application.deploy" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"title\":\"Deploy Vendza API from main\",\"description\":\"Synchronize production with vendza-api main\"}" \
            -o deploy.json
          curl --fail-with-body -sS "${base}/api/application.one?applicationId=${APPLICATION_ID}" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" -o state.json
          python3 - <<'PY'
          import json
          state=json.load(open('state.json'))
          existing=state.get('env') or ''
          lines=[line for line in existing.splitlines() if not line.startswith('GOOGLE_WEB_CLIENT_ID=')]
          lines.append('GOOGLE_WEB_CLIENT_ID=992593495811-ogh34thu3rg606tjgnd7jdf8ir7n32ok.apps.googleusercontent.com')
          json.dump({'applicationId':'CHl42zYU8qsZw3QyKn9dP','env':'\n'.join(lines)+'\n','createEnvFile':bool(state.get('createEnvFile', True))}, open('environment.json','w'))
          PY
          curl --fail-with-body -sS -X POST "${base}/api/application.saveEnvironment" "${headers[@]}" \
            --data-binary @environment.json -o environment-save.json
          github_id="$(python3 -c 'import json; print(json.load(open("state.json"))["githubId"])')"
          curl --fail-with-body -sS -X POST "${base}/api/application.saveGithubProvider" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"repository\":\"vendza-api\",\"owner\":\"DocteurLaj\",\"buildPath\":\"/\",\"githubId\":\"${github_id}\",\"branch\":\"main\",\"triggerType\":\"push\",\"watchPaths\":[]}" \
            -o provider.json
          curl --fail-with-body -sS -X POST "${base}/api/application.deploy" "${headers[@]}" \
            --data "{\"applicationId\":\"${APPLICATION_ID}\",\"title\":\"Deploy Vendza API after GitHub provider resync\",\"description\":\"Restore GitHub push deployment for vendza-api main\"}" \
            -o deploy-after-provider.json
          curl --fail-with-body -sS "${base}/api/application.readLogs?applicationId=${APPLICATION_ID}&tail=1000" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" -o logs.json
          python3 - <<'PY'
          import json
          state=json.load(open('state.json'))
          print(json.dumps({
              'name': state.get('name'),
              'autoDeploy': state.get('autoDeploy'),
              'triggerType': state.get('triggerType'),
              'branch': state.get('branch'),
              'repository': state.get('repository'),
              'hasGitProviderAccess': state.get('hasGitProviderAccess'),
              'unauthorizedProvider': state.get('unauthorizedProvider'),
              'githubId_present': bool(state.get('githubId')),
              'deployment_count': len(state.get('deployments', [])),
              'latest_deployment': state.get('deployments', [])[-1] if state.get('deployments') else None,
          }, ensure_ascii=False))
          logs=json.load(open('logs.json'))
          text=json.dumps(logs, ensure_ascii=False).lower()
          print(json.dumps({'logs_type': type(logs).__name__, 'log_keys': sorted(logs.keys()) if isinstance(logs, dict) else None, 'contains_webhook': 'webhook' in text}))
          PY
