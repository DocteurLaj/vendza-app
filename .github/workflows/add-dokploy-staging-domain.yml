name: Add Dokploy staging domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create HTTPS staging domain
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc '{host:"staging-app.vendza.online",path:"/",port:8081,https:true,certificateType:"letsencrypt",applicationId:"d2mk5ASilX-6WhgDV5kK4",domainType:"application",stripPath:false}')
          curl --fail --silent --show-error \
            --request POST \
            "${DOKPLOY_URL%/}/api/domain.create" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "$payload" | jq '{message,data}'
