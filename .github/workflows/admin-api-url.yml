name: Point Control Center at api.vendza.online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update admin environment and redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="${DOKPLOY_URL%/}/api"
          hdr=(--header "accept: application/json" --header "content-type: application/json" --header "x-api-key: ${DOKPLOY_API_TOKEN}")
          app=qrH_E1A1zIa0qSqUvWpTS
          payload=$(jq -nc --arg id "$app" '{applicationId:$id, env:"VENDZA_API_URL=https://api.vendza.online", buildArgs:"", buildSecrets:"", createEnvFile:true}')
          code=$(curl --silent --show-error -o resp.json -w '%{http_code}' --request POST "$api/application.saveEnvironment" "${hdr[@]}" --data "$payload")
          if [ "$code" != 200 ]; then echo "saveEnvironment failed: $code"; jq -c '{message: (.message // .error // .), issues: .issues}' resp.json 2>/dev/null | cut -c1-600 || head -c 600 resp.json; exit 1; fi
          echo "environment saved"
          curl --fail --silent --show-error --request POST "$api/application.redeploy" "${hdr[@]}" \
            --data "$(jq -nc --arg id "$app" '{applicationId:$id, title:"Switch to api.vendza.online (#117)"}')" >/dev/null
          echo "redeploy requested"
