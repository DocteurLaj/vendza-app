name: Recover Dokploy API service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Redeploy API from GitHub through Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc '{applicationId:"CHl42zYU8qsZw3QyKn9dP",titleLog:"Recovery: rebuild vendza API from GitHub"}')
          curl --fail --silent --show-error \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "$payload" > /tmp/deploy.json
          echo "Dokploy API rebuild requested."
          cat /tmp/deploy.json | jq 'if type == "object" then {deploymentId,status,title} else . end'
