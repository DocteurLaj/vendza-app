name: One-time Check API Release
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Dokploy release state
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS "${DOKPLOY_URL%/}/api/application.one?applicationId=CHl42zYU8qsZw3QyKn9dP" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" -o state.json
          python3 - <<'PY'
          import json
          s=json.load(open('state.json'))
          d=s.get('deployments', [])[-3:]
          print(json.dumps({'status':s.get('applicationStatus'),'latest':d},ensure_ascii=False))
          PY
