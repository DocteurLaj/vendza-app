name: Add staging origin to API CORS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preserve API environment and add staging origin
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          application_id="CHl42zYU8qsZw3QyKn9dP"
          curl --fail --silent --show-error \
            --request GET \
            "${DOKPLOY_URL%/}/api/application.one?applicationId=${application_id}" \
            --header "accept: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" > /tmp/api-application.json
          jq -e '(.env | type == "string") and (.env | contains("DATABASE_URL=")) and (.env | contains("SECRET_KEY=")) and (.env | contains("CORS_ORIGINS="))' /tmp/api-application.json >/dev/null
          jq -r '.env' /tmp/api-application.json > /tmp/api-env.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/api-env.txt')
          lines = p.read_text().splitlines()
          origin = 'https://staging-app.vendza.online'
          found = False
          output = []
          for line in lines:
              if line.startswith('CORS_ORIGINS='):
                  values = [v.strip() for v in line.split('=', 1)[1].split(',') if v.strip()]
                  if origin not in values:
                      values.append(origin)
                  line = 'CORS_ORIGINS=' + ','.join(values)
                  found = True
              output.append(line)
          if not found:
              raise SystemExit('CORS_ORIGINS was not found')
          p.write_text('\n'.join(output) + '\n')
          PY
          env_block=$(cat /tmp/api-env.txt)
          build_args=$(jq -r '.buildArgs // ""' /tmp/api-application.json)
          build_secrets=$(jq -r '.buildSecrets // ""' /tmp/api-application.json)
          payload=$(jq -nc \
            --arg id "$application_id" \
            --arg env "$env_block" \
            --arg buildArgs "$build_args" \
            --arg buildSecrets "$build_secrets" \
            '{applicationId:$id,env:$env,buildArgs:$buildArgs,buildSecrets:$buildSecrets,createEnvFile:false}')
          curl --fail --silent --show-error \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.saveEnvironment" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "$payload" >/dev/null
          deploy_payload=$(jq -nc '{applicationId:"CHl42zYU8qsZw3QyKn9dP",titleLog:"fix(cors): authorize staging web origin"}')
          curl --fail --silent --show-error \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "$deploy_payload" >/dev/null
          echo "CORS staging origin saved and API redeployment requested."
